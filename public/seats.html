<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براق | اختر مقعداً</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#003366">
</head>

<body class="booking-page-bg">

    <header class="main-header">
        <div class="navbar-container">
             <button class="burger-menu" onclick="openNav()">
                 <div class="bar"></div>
                 <div class="bar"></div>
                 <div class="bar"></div>
             </button>

             <div class="brand">
                <img src="img/my-horse4.png" alt="شعار براق" style="width: 30px; height: 30px; border-radius: 50%;">
                <span>براق</span>
             </div>

             <a href="javascript:history.back()" class="back-link" style="color: white; text-decoration: none; font-size: 0.9rem;">
                رجوع <i class="bi bi-chevron-left"></i>
             </a>
        </div>
    </header>

    <div class="booking-card-container" style="margin-top: 100px;">
        <h2 class="booking-title">اختر مقعداً</h2>

        <div class="car-layout">
            <div class="seat-row front-row">
                <div class="seat driver reserved">
                    <i class="bi bi-steering exchange-icon-inner"></i>
                    <span class="seat-label">السائق</span>
                </div>

                <div class="seat-box available" onclick="selectSeat(this)" data-seat="1">
                    <div class="seat-square"></div>
                    <span class="seat-number">1</span>
                </div>
            </div>

            <div class="seat-row back-row">
                <div class="seat-box available" onclick="selectSeat(this)" data-seat="2">
                    <div class="seat-square"></div>
                    <span class="seat-number">2</span>
                </div>

                <div class="seat-box available" onclick="selectSeat(this)" data-seat="3">
                    <div class="seat-square"></div>
                    <span class="seat-number">3</span>
                </div>

                <div class="seat-box available" onclick="selectSeat(this)" data-seat="4">
                    <div class="seat-square"></div>
                    <span class="seat-number">4</span>
                </div>
            </div>
        </div>

        <div class="booking-summary-box">
            <h3>ملخص الحجز</h3>
            <p>عدد المقاعد: <span id="selectedSeatsCount">0</span></p>
            <p>المقاعد المختارة: <span id="selectedSeatsText">لا يوجد</span></p>
            <p>المسافة التقريبية: <span id="distanceText">--</span> كم</p>
            <p>السعر الشهري: <span id="priceText">--</span> JOD</p>
        </div>

        <div class="seat-actions">
            <button class="confirm-search-btn" id="confirmBtn" disabled onclick="openVisaModal()">
                طلب سائق
            </button>

            <button class="cancel-booking-btn" onclick="cancelSeatBooking()">
                إلغاء
            </button>
        </div>
    </div>

    <div id="sideMenu" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        
        <div class="user-profile-sidebar" onclick="goToProfile()" style="cursor: pointer;">
            <img src="img/my-user.png" alt="صورة المستخدم" class="sidebar-avatar">
            <h4 class="user-name" id="sidebarUserName"></h4>
            <p class="user-phone" id="sidebarUserPhone"></p>
        </div>

        <hr style="border: 0.5px solid rgba(255,255,255,0.1); margin: 10px 20px;">

        <div class="sidebar-content">
            <a href="notifications.html"><i class="bi bi-bell"></i> الإشعارات</a>
            <a href="help.html"><i class="bi bi-question-circle"></i> مركز المساعدة</a>
            <hr style="border: 0.5px solid rgba(255,255,255,0.1); margin: 20px;">
            <a href="driver-signup.html" class="driver-link"><i class="bi bi-car-front"></i> سجل كسائق براق</a>
        </div>
    </div>

    <div id="overlay" class="overlay" onclick="closeNav()"></div>

    <div id="visaModal" class="visa-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center;">
        <div class="visa-modal-card" style="background: #ffffff; width: 90%; max-width: 400px; padding: 25px; border-radius: 15px; direction: rtl; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
            <h3 style="color: #003366; margin-bottom: 20px; text-align: center;"><i class="bi bi-credit-card"></i> الدفع الآمن | بطاقة الائتمان</h3>
            
            <form id="visaForm" onsubmit="handleVisaSubmit(event)">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; color: #333; font-weight: bold; text-align: right;">اسم حامل البطاقة:</label>
                    <input type="text" id="visaName" required placeholder="Ahmad Adnan" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; color: #333; font-weight: bold; text-align: right;">رقم البطاقة (16 خانة):</label>
                    <input type="text" id="visaCardNumber" required maxlength="16" pattern="\d{16}" placeholder="4000123456789010" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
                </div>
                
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 5px; color: #333; font-weight: bold; text-align: right;">تاريخ الانتهاء:</label>
                        <input type="text" id="visaExpiry" required placeholder="MM/YY" maxlength="5" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; text-align: center; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 5px; color: #333; font-weight: bold; text-align: right;">رمز الـ CVC:</label>
                        <input type="password" id="visaCvc" required maxlength="3" pattern="\d{3}" placeholder="***" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; text-align: center; box-sizing: border-box;">
                    </div>
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <button type="submit" style="flex: 2; background: #70AD47; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">
                        تأكيد وإرسال الطلب
                    </button>
                    <button type="button" onclick="closeVisaModal()" style="flex: 1; background: #666; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer;">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCcoBS38vS_L76jZlhy2VGPFSSfRdjQ8Ns&libraries=places&v=beta&loading=async&callback=initMapInputs" async defer></script>
    <script src="script.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/service-worker.js");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براق | احجز رحلتك</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

   
</head>

<body class="booking-page-bg">



<header class="main-header">
    <div class="navbar-container">
        <div class="header-right-side">
            <button class="burger-menu" onclick="openNav()">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </button>

            <div class="brand">
                <img src="img/my-horse4.png" alt="شعار براق">
                <span>براق</span>
            </div>

            <nav class="nav-links-modern">
                <a href="index.html" class="nav-item-effect active"> العوده للرئيسية</a>
               <a href="schedule.html" class="nav-item-effect">الاشتراكات</a>
                <a href="index.html#about-section" class="nav-item-effect">من نحن</a>
            </nav>
        </div>

        <div class="auth-group">
            <a href="login.html" id="loginBtn" class="login-link-new">تسجيل دخول</a>
            <a href="signup.html" id="signupBtn" class="signup-btn">سجل الآن</a>
        </div>
    </div>
</header>

<div class="booking-logo-header">
    <div class="logo-glow-wrapper"></div>
    <h1 class="booking-main-title">احجز رحلتك</h1>
</div>

<div class="slogan">
    <img src="img/my-horse4.png" alt="شعار براق">
</div>

<div class="booking-card-container">
    <h2 class="booking-title">احجز رحلة</h2>

    <div class="trip-options">
        <button id="btnOneWay" class="opt-btn active" onclick="updateTripType('one-way')">ذهاب</button>
        <button id="btnRoundTrip" class="opt-btn" onclick="updateTripType('round-trip')">ذهاب وإياب</button>
    </div>

    <div class="location-group">
        <div class="location-item">
            <label>من</label>
            <div class="loc-input-wrap">
                <i class="bi bi-geo-alt"></i>
<div id="pickupInput" class="location-input"></div>
<button type="button" class="current-location-btn" onclick="openMapPicker('pickup')">
  <i class="bi bi-map"></i> تحديد من الخريطة
</button>

            </div>
            <button type="button" class="current-location-btn" onclick="useCurrentLocation()">
                <i class="bi bi-crosshair"></i> موقعي الحالي
            </button>
        </div>

        <div class="location-item">
            <label>إلى</label>
            <div class="loc-input-wrap">
                <i class="bi bi-geo-fill"></i>
                <div id="dropoffInput" class="location-input"></div>
                <button type="button" class="current-location-btn" onclick="openMapPicker('dropoff')">
  <i class="bi bi-map"></i> تحديد الوجهة من الخريطة
</button>
            </div>
        </div>
    </div>

    <div class="date-group">
        <label><i class="bi bi-calendar3"></i> تاريخ المغادرة</label>
<input type="date" id="bookingDate" class="date-field">
        <div class="time-selection">
            <div class="time-box">
                <label>وقت الذهاب</label>
                <input type="time" id="goTime" class="time-field">
            </div>

            <div id="returnTimeBox" class="time-box" style="display: none;">
                <label>وقت العودة</label>
                <input type="time" id="returnTime" class="time-field">
            </div>
        </div>
    </div>

    <div class="passengers-group">
        <div class="selection-row">
            <label><i class="bi bi-person"></i> حجز شخصي</label>
            <input type="checkbox" id="checkAdult" class="custom-check">
        </div>

        <div class="selection-row">
            <label><i class="bi bi-person-wheelchair"></i> ذوي الهمم (مقعدين)</label>
            <input type="checkbox" id="checkSpecial" class="custom-check">
        </div>
    </div>

    <div class="other-person-group">
      <div class="other-person-group">
    <div class="selection-row">
        <label><i class="bi bi-person-plus"></i> حجز لشخص آخر</label>
        <input type="checkbox" id="checkOther" class="custom-check" onchange="toggleOtherPersonModal(this)">
    </div>

    <div id="otherPersonPreview" class="other-preview" style="display:none;"></div>
</div>
    </div>


    <button class="confirm-search-btn" onclick="checkAndGo()">بحث عن رحلات</button>
</div>

<div id="sideMenu" class="sidebar">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>

    <div class="user-profile-sidebar" onclick="goToProfile()" style="cursor: pointer;">
        <img src="img/my-user.png" alt="صورة المستخدم" class="sidebar-avatar">
        <h4 class="user-name" id="sidebarUserName"></h4>
        <p class="user-phone" id="sidebarUserPhone"></p>
    </div>

    <div class="sidebar-content">
        <a href="notifications.html"><i class="bi bi-bell"></i> الإشعارات</a>
      <a href="help.html"><i class="bi bi-question-circle"></i> مركز المساعدة</a>
        <hr style="border: 0.5px solid rgba(255,255,255,0.1); margin: 20px;">
        <a href="driver-signup.html" class="driver-link"><i class="bi bi-car-front"></i> سجل كسائق براق</a>
    </div>
</div>

<div id="overlay" class="overlay" onclick="closeNav()"></div>

<script src="script.js"></script>
<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCcoBS38vS_L76jZlhy2VGPFSSfRdjQ8Ns&libraries=places&v=beta&loading=async&callback=initMapInputs"
  async
  defer>
</script>
<div id="mapPickerModal" class="map-modal" style="display:none;">
  <div class="map-box">
    <div class="map-header">
      <h3 id="mapPickerTitle">حدد الموقع</h3>
      <button onclick="closeMapPicker()">×</button>
    </div>

    <input id="mapSearchInput" class="map-search-input" placeholder="ابحث عن مكان...">
    

    <div id="pickerMap" class="picker-map"></div>

    <button class="confirm-map-btn" onclick="confirmMapLocation()">
      تأكيد الموقع
    </button>
  </div>
</div>

<div id="otherPersonModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <h3>بيانات الشخص الآخر</h3>

        <input type="text" id="dependentFirstName" placeholder="الاسم الأول">
        <input type="text" id="dependentLastName" placeholder="اسم العائلة">
        <input type="date" id="dependentDOB">        <input type="text" id="dependentRelationship" placeholder="صلة القرابة">
        <input type="tel" id="dependentPhone" placeholder="رقم الهاتف - اختياري">

        <div class="modal-btns">
            <button class="btn-save" onclick="saveOtherPerson()">حفظ</button>
            <button class="btn-cancel" onclick="cancelOtherPerson()">إلغاء</button>
        </div>
    </div>
</div>
</body>
</html>

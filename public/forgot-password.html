<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براق | استعادة كلمة المرور</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="booking-page-bg">

    <div class="auth-container">
        <div class="brand-header-login">
            <div class="brand-logo-circle">
                <img src="img/my-horse4.png" alt="لوجو براق"style="width: 80px; height: 80px; border-radius: 50%;">
            </div>
            <h1 class="brand-name-blue">براق</h1>
            <p id="step-desc">استعادة الوصول إلى حسابك</p>
        </div>

        <div class="auth-card">
            <div id="forgot-step1">
                <h3 class="form-section-title">نسيت كلمة المرور؟</h3>
                <p style="text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 20px;">أدخل رقم هاتفك المسجل لنرسل لك رمز التحقق.</p>
                <div class="input-group-auth">
                    <label><i class="bi bi-telephone"></i> رقم الهاتف</label>
                    <div class="phone-row-input">
                        <div class="flag-code"><span>+962</span></div>
                        <input type="tel" id="resetPhone" placeholder="7XXXXXXXX" required>
                    </div>
                </div>
                <button class="auth-btn" onclick="showResetStep(2)">إرسال رمز التحقق</button>
            </div>

            <div id="forgot-step2" style="display: none;">
                <h3 class="form-section-title">تحقق من الرقم</h3>
                <p style="text-align: center; color: #666; font-size: 0.85rem;">أدخل الرمز المكون من 4 أرقام</p>
                <div class="otp-flex">
                    <input type="text" maxlength="1" class="otp-field">
                    <input type="text" maxlength="1" class="otp-field">
                    <input type="text" maxlength="1" class="otp-field">
                    <input type="text" maxlength="1" class="otp-field">
                </div>
                <button class="auth-btn" onclick="showResetStep(3)">تأكيد الرمز</button>
            </div>

            <div id="forgot-step3" style="display: none;">
                <h3 class="form-section-title">كلمة مرور جديدة</h3>
                <div class="input-group-auth">
                    <label><i class="bi bi-lock"></i> كلمة المرور الجديدة</label>
                    <input type="password" id="newPass" placeholder="********">
                </div>
                <div class="input-group-auth">
                    <label><i class="bi bi-shield-lock"></i> تأكيد كلمة المرور</label>
                    <input type="password" id="confirmNewPass" placeholder="********">
                </div>
                <button class="auth-btn" onclick="finishPasswordReset()">حفظ وتغيير</button>
            </div>

            <div class="auth-footer" style="margin-top: 20px;">
                <a href="login.html" style="color: #003366; text-decoration: none; font-weight: bold;">
                    <i class="bi bi-arrow-right"></i> العودة لتسجيل الدخول
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براق | إنشاء حساب جديد</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<meta name="theme-color" content="#003366">
</head>
<body class="booking-page-bg">

    <!-- شعار واسم الموقع -->
      <div class="brand">
        <img src="img/my-horse4.png" alt="شعار براق">
        <span>براق</span>
      </div>
    <div class="auth-container">
        <div class="auth-logo">
            <p>أهلاً بك في رحلتك الأولى</p>
        </div>

        <div class="auth-card">
           <form id="signupForm">
    <div class="input-group-auth">
        <label><i class="bi bi-person"></i> الاسم الكامل</label>
        <input type="text" id="userName" placeholder="أدخل اسمك الثلاثي" required>
    </div>

    <div class="input-group-auth">
        <label><i class="bi bi-telephone"></i> رقم الهاتف</label>
        <div class="phone-input-wrapper">
            <select id="countryCode" class="country-select">
                <option value="+962">🇯🇴 +962</option>
                <option value="+966">🇸🇦 +966</option>
                <option value="+971">🇦🇪 +971</option>
                <option value="+20">🇪🇬 +20</option>
            </select>
            <input type="tel" id="userPhone" placeholder="7XXXXXXXX" required>
        </div>
    </div>

    <div class="input-group-auth">
        <label><i class="bi bi-calendar-event"></i> تاريخ الميلاد</label>
        <input type="date" id="userDOB" required>
    </div>

    <div class="input-group-auth">
        <label><i class="bi bi-lock"></i> كلمة المرور</label>
        <input type="password" id="userPass" placeholder="********" required>
    </div>
<div id="recaptcha-container"></div>
    <button type="submit" class="auth-btn">إنشاء الحساب</button>
</form>

            <div class="auth-footer">
                <span>لديك حساب بالفعل؟</span>
                <a href="login.html">تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <div id="otpModal" class="modal-overlay">
        <div class="modal-content">
            <h3>التحقق من الهاتف</h3>
            <p>أدخل الرمز المكون من 6 أرقام المرسل إلى هاتفك</p>
         <div class="otp-inputs">
    <input maxlength="1" class="otp-digit">
    <input maxlength="1" class="otp-digit">
    <input maxlength="1" class="otp-digit">
    <input maxlength="1" class="otp-digit">
    <input maxlength="1" class="otp-digit">
    <input maxlength="1" class="otp-digit">
</div>
            <button class="confirm-btn" onclick="verifyOTP()">تأكيد ودخول</button>
            <button class="cancel-link" onclick="closeOTP()">إلغاء</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js");
  }
</script>
</body>
</html>

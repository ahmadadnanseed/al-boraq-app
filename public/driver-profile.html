<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براق كابتن | ملفي الشخصي</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="profile-body">

    <header class="profile-header-nav">
        <a href="javascript:history.back()" style="color: #333;">
            <i class="bi bi-chevron-right"></i>
        </a>
        <span style="font-size: 0.9rem;">حساب الكابتن في براق</span>
        <div style="width: 20px;"></div>
    </header>

    <div class="user-main-info">
        <div class="avatar-circle" id="driverAvatarLetter"></div>
        <h2 id="driverTopName"></h2>
        <p id="driverTopPhone"></p>

        <div class="rating-badge" style="color: #ffc107; font-size: 0.9rem; margin-top: 5px;">
            <i class="bi bi-star-fill"></i> 4.9 (تقييم الكابتن)
        </div>
    </div>

    <div class="settings-list">

        <div class="setting-item" onclick="driver_openEdit('name', 'الاسم')">
            <div class="setting-text">
                <span class="label">الاسم الكامل</span>
                <span class="value" id="driver-val-name"></span>
            </div>
            <i class="bi bi-person-badge icon-gray"></i>
        </div>

        <div class="setting-item" onclick="driver_openEdit('phone', 'رقم الهاتف')">
            <div class="setting-text">
                <span class="label">رقم الهاتف</span>
                <span class="value" id="driver-val-phone"></span>
            </div>
            <i class="bi bi-telephone icon-gray"></i>
        </div>

        <div class="setting-item" onclick="driver_openEdit('address', 'العنوان')">
            <div class="setting-text">
                <span class="label">العنوان</span>
                <span class="value" id="driver-val-address"></span>
            </div>
            <i class="bi bi-geo-alt icon-gray"></i>
        </div>

        <div class="list-divider"></div>

        <div class="setting-item" onclick="driver_openEdit('vehicleType', 'نوع المركبة')">
            <div class="setting-text">
                <span class="label">نوع المركبة</span>
                <span class="value" id="driver-val-vehicleType"></span>
            </div>
            <i class="bi bi-car-front icon-gray"></i>
        </div>

        <div class="setting-item" onclick="driver_openEdit('vehicleModel', 'موديل المركبة')">
            <div class="setting-text">
                <span class="label">موديل المركبة</span>
                <span class="value" id="driver-val-vehicleModel"></span>
            </div>
            <i class="bi bi-car-front-fill icon-gray"></i>
        </div>

        <div class="setting-item" onclick="driver_openEdit('vehicleYear', 'سنة الصنع')">
            <div class="setting-text">
                <span class="label">سنة الصنع</span>
                <span class="value" id="driver-val-vehicleYear"></span>
            </div>
            <i class="bi bi-calendar icon-gray"></i>
        </div>

        <div class="setting-item" onclick="driver_openEdit('plate', 'رقم اللوحة')">
            <div class="setting-text">
                <span class="label">رقم اللوحة</span>
                <span class="value" id="driver-val-plate"></span>
            </div>
            <i class="bi bi-card-heading icon-gray"></i>
        </div>

        <div class="setting-item" onclick="driver_openEdit('color', 'لون المركبة')">
            <div class="setting-text">
                <span class="label">لون المركبة</span>
                <span class="value" id="driver-val-color"></span>
            </div>
            <i class="bi bi-palette icon-gray"></i>
        </div>

        <div class="list-divider"></div>

        <div class="setting-item">
            <div class="setting-text">
                <span class="label">إجمالي الرحلات</span>
                <span class="value" id="driver-val-trips">0 رحلة</span>
            </div>
            <i class="bi bi-speedometer2 icon-gray"></i>
        </div>
    </div>

    <div id="driverEditModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3 id="driverModalTitle">تعديل البيانات</h3>
            <div id="driverInputBox"></div>
            <div class="modal-btns">
                <button class="btn-save" onclick="driver_saveChange()">تأكيد الحفظ</button>
                <button class="btn-cancel" onclick="driver_closeEdit()">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="list-divider"></div>

    <div class="setting-item logout-item" onclick="handleLogout()">
        <div class="setting-text">
            <span class="label" style="color: #d9534f;">الخروج من النظام</span>
            <span class="value" style="color: #d9534f; font-weight: bold;">تسجيل الخروج</span>
        </div>
        <i class="bi bi-box-arrow-right icon-red"></i>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>براق | الإشعارات</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#003366">
</head>

<body class="booking-page-bg">

  <header class="main-header">
    <div class="navbar-container">
      

      <div class="brand">
        <img src="img/my-horse4.png" alt="شعار براق">
        <span>براق</span>
      </div>

      <a href="javascript:history.back()" class="back-link" style="color:white;text-decoration:none;">
        رجوع <i class="bi bi-chevron-left"></i>
      </a>
    </div>
  </header>

  <div class="notifications-container">
  <h1 class="booking-title">الإشعارات</h1>

  <div id="todayTripsNotifications"></div>
</div>

<div id="postponeModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h3>تأجيل الرحلة</h3>

    <label>اختر تاريخ التأجيل</label>
    <input type="date" id="postponeDate">

    <div class="modal-btns">
      <button class="btn-save" onclick="confirmPostponeTrip()">تأكيد</button>
      <button class="btn-cancel" onclick="closePostponeModal()">إلغاء</button>
    </div>
  </div>
</div>
<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCcoBS38vS_L76jZlhy2VGPFSSfRdjQ8Ns&libraries=places&v=beta&loading=async&callback=initMapInputs"
  async
  defer>
</script>
  <script src="script.js"></script>
  <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js");
  }
</script>
</body>
</html>

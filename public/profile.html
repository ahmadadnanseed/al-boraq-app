<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>براق | حسابي</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#003366">
</head>
<body class="profile-body">

    <header class="profile-header-nav">
        <a href="javascript:history.back()" style="color: #333;">
            <i class="bi bi-chevron-right"></i>
        </a>
        <span style="font-size: 0.9rem;">حسابك في براق</span>
        <div style="width: 20px;"></div>
    </header>

    <div class="user-main-info">
        <div class="avatar-circle" id="avatarLetter"></div>
        <h2 id="topName"></h2>
        <p id="topPhone"></p>
    </div>

    <div class="settings-list">

        <div class="setting-item" onclick="openEdit('name', 'الاسم')">
            <div class="setting-text">
                <span class="label">الاسم</span>
                <span class="value" id="val-name"></span>
            </div>
            <i class="bi bi-person icon-gray"></i>
        </div>

        <div class="setting-item" onclick="openEdit('phone', 'رقم الهاتف')">
            <div class="setting-text">
                <span class="label">رقم الهاتف</span>
                <span class="value" id="val-phone"></span>
            </div>
            <i class="bi bi-telephone icon-gray"></i>
        </div>

        <div class="setting-item" onclick="openEdit('email', 'البريد الإلكتروني')">
            <div class="setting-text">
                <span class="label">عنوان البريد الإلكتروني</span>
                <span class="value" id="val-email"></span>
            </div>
            <i class="bi bi-envelope icon-gray"></i>
        </div>

        <div class="list-divider"></div>

        <div class="setting-item" onclick="openEdit('dob', 'تاريخ الميلاد')">
            <div class="setting-text">
                <span class="label">تاريخ الميلاد</span>
                <span class="value" id="val-dob"></span>
            </div>
            <i class="bi bi-calendar3 icon-gray"></i>
        </div>

        <div class="setting-item" onclick="openEdit('gender', 'الجنس')">
            <div class="setting-text">
                <span class="label">الجنس</span>
                <span class="value" id="val-gender"></span>
            </div>
            <i class="bi bi-gender-ambiguous icon-gray"></i>
        </div>
    </div>

    <div id="profileEditModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3 id="modalTitle">تعديل</h3>

            <div id="inputBox"></div>

            <div class="modal-btns">
                <button class="btn-save" onclick="saveChange()">تأكيد</button>
                <button class="btn-cancel" onclick="closeEdit()">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="list-divider"></div>

    <div class="setting-item logout-item" onclick="handleLogout()">
        <div class="setting-text">
            <span class="label" style="color: #d9534f;">الخروج من الحساب</span>
            <span class="value" style="color: #d9534f; font-weight: bold;">تسجيل الخروج</span>
        </div>
        <i class="bi bi-box-arrow-right icon-red"></i>
    </div>

    <script src="script.js"></script>
    <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js");
  }
</script>
</body>
</html>

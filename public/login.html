<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براق - تسجيل الدخول</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="login-page-body">

    <div class="login-card">

        <div class="slogan">
            <img src="img/my-horse4.png" alt="شعار براق">
        </div>

        <h2>تسجيل الدخول</h2>

        <!-- 👇 أهم تعديل هنا -->
        <form id="loginForm" onsubmit="handleLogin(event); return false;">

            <select id="countryCode">
                <option value="+962">🇯🇴 +962</option>
                <option value="+966">🇸🇦 +966</option>
                <option value="+971">🇦🇪 +971</option>
                <option value="+20">🇪🇬 +20</option>
            </select>

            <!-- 👇 خليها text عشان تقبل driver9 -->
           <input type="text" id="userPhone" placeholder="رقم الهاتف أو driver9 أو admin1" required>

            <input type="password" id="password" placeholder="كلمة المرور" required>

            <div id="errorMessage" style="color:red;"></div>

            <button type="submit">دخول</button>
        </form>

        <div class="footer-links">
            <p>ليس لديك حساب؟ <a href="signup.html">سجل الآن</a></p>
            <p><a href="forgot-password.html">نسيت كلمة المرور؟</a></p>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>

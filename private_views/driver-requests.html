<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براق كابتن | طلبات الرحلات</title>
    <link class="styles" rel="stylesheet" href="/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#003366">
</head>
<body class="driver-dashboard-bg">

   
    <header class="driver-profile-summary-bar" style="background: #002244; color: white; padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #ED7D31; direction: rtl;">
       
        <nav class="nav-links">
            <a href="/driver-requests.html" class="active">الرئيسية</a>
            <a href="/driver-daily-trips.html">الاشتراكات</a>
        </nav>
   

        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="/img/my-user.png" alt="صورة السائق" style="width: 65px; height: 65px; border-radius: 50%; border: 2px solid white; background-color: #fff;">
            <div>
                <h3 id="driverNameLabel" style="margin: 0; font-size: 1.3rem;">جاري تحميل اسم السائق...</h3>
                <div style="color: #FFC000; font-size: 1.1rem; margin-top: 5px;">
                    <i class="bi bi-star-fill"></i> <span id="driverRatingLabel">--</span> (تقييم الكابتن)
                </div>
            </div>
        </div>
        <div style="text-align: left;">
            <span style="font-size: 0.85rem; opacity: 0.8; display: block;">المركبة المعتمدة</span>
            <strong id="driverVehicleLabel" style="color: #70AD47;">جاري التحميل...</strong>
        </div>
    
     </header>

    <div class="dashboard-main-layout" style="display: flex; flex-wrap: wrap-reverse; gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; direction: rtl;">
        
        <div class="requests-container" style="flex: 2; min-width: 320px; padding: 0; margin: 0;">
            <h2 class="driver-page-title" style="margin-top: 0; font-size: 1.4rem; color: #003366;">طلبات الاشتراكات الجديدة</h2>
            <div id="driverRequestsList"></div>
        </div>

        <div class="filter-sidebar-card" style="background: #242667; flex: 1; min-width: 300px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; height: fit-content;">
            <h3 style="color: #003366; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px;"><i class="bi bi-sliders"></i> تصفية الاشتراكات</h3>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #555;">نوع الرحلة:</label>
                <select id="filterTripType" style="width: 100%; padding: 10px; border: 1px solid #2f335f; border-radius: 8px;">
                    <option value="all">كل الأنواع</option>
                    <option value="one-way">ذهاب فقط</option>
                    <option value="round-trip">ذهاب وإياب</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #555;">الحد الأدنى للسعر الشهري: <span id="priceVal" style="color:#ED7D31; font-weight:bold;">10</span> JOD</label>
                <input type="range" id="filterPrice" min="10" max="200" value="10" oninput="document.getElementById('priceVal').innerText = this.value" style="width: 100%; accent-color: #ED7D31;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #555;">وقت انطلاق الرحلة التقريبي:</label>
                <input type="time" id="filterTime" value="08:00" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 8px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #555;">رقم المقعد المطلوب (اختياري):</label>
                <select id="filterSeat" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;">
                    <option value="all">أي مقعد</option>
                    <option value="1">مقعد 1 (الأمامي)</option>
                    <option value="2">مقعد 2</option>
                    <option value="3">مقعد 3</option>
                    <option value="4">مقعد 4</option>
                </select>
            </div>

            <button onclick="applyDynamicFilters()" style="width: 100%; background: #70AD47; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s;">
                <i class="bi bi-search"></i> بدء البحث
            </button>
        </div>

    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCcoBS38vS_L76jZlhy2VGPFSSfRdjQ8Ns&libraries=places&v=beta&loading=async&callback=initMapInputs" async defer></script>
    <script src="/script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/service-worker.js");
      }
    </script>
</body>
</html>

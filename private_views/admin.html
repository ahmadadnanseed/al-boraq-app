<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>براق | لوحة تحكم المسؤول</title>
    <!-- تم إضافة / لضمان قراءة التصاميم من المجلد العام بأمان -->
    <link rel="stylesheet" href="/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#003366">
</head>
<body class="admin-dashboard-body">

    <header class="main-header">
        <div class="navbar-container">
            <div class="brand">
                <img src="/img/my-horse4.png" alt="شعار براق" />
                <span class="admin-mode-text">براق Admin</span>
            </div>

            <div class="header-left-actions">
                <button type="button" class="requests-btn" onclick="openDriverRequestsModal()">
                    <i class="bi bi-person-badge"></i>
                    طلبات الاشتراك
                </button>

                <a href="/index.html" class="logout-link-modern">
                    <i class="bi bi-box-arrow-right"></i> تسجيل الخروج
                </a>
            </div>
        </div>
    </header>

    <div class="admin-main-wrapper">
        <h1 class="page-title">لوحة التحكم</h1>

        <div class="stats-overview-grid">
            <div class="overview-card active-card" onclick="selectDashboardSection('users', event)">
                <i class="bi bi-people-fill"></i>
                <div class="card-text-group">
                    <h3 id="usersCount">0</h3>
                    <p>المستخدمون</p>
                </div>
            </div>

            <div class="overview-card" onclick="selectDashboardSection('pendingSubs', event)">
                <i class="bi bi-hourglass-split"></i>
                <div class="card-text-group">
                    <h3 id="pendingSubsCount">0</h3>
                    <p>الاشتراكات المعلقة</p>
                </div>
            </div>

            <div class="overview-card" onclick="selectDashboardSection('activeSubs', event)">
                <i class="bi bi-patch-check-fill"></i>
                <div class="card-text-group">
                    <h3 id="activeSubsCount">0</h3>
                    <p>الاشتراكات الفعالة</p>
                </div>
            </div>

            <div class="overview-card" onclick="selectDashboardSection('drivers', event)">
                <i class="bi bi-car-front-fill"></i>
                <div class="card-text-group">
                    <h3 id="driversCount">0</h3>
                    <p>السائقين</p>
                </div>
            </div>
        </div>

        <div class="admin-analytics-box">
            <div class="chart-search-wrap">
                <div class="chart-box">
                    <h3 id="chartTitle" style="margin-bottom:20px; color:#fff;">رسم بياني - المستخدمون</h3>
                    <canvas id="adminChart"></canvas>
                </div>

                <div class="search-box-panel">
                    <h3 id="searchTitle" style="margin-bottom:15px; color:#fff;">بحث بالـ ID</h3>

                    <div class="search-inline">
                        <input type="text" id="searchInput" placeholder="اكتب الـ ID هنا" />
                        <button type="button" onclick="searchById()">بحث</button>
                    </div>

                    <div id="searchResultBox" style="color:#fff; min-height:100px;">
                        اكتب الـ ID ثم اضغط بحث
                    </div>
                </div>
            </div>
        </div>

        <div class="admin-table-container" style="margin-top:30px;">
            <table class="modern-dark-table">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- نافذة طلبات اشتراك السائقين -->
    <div id="driverRequestsModal" class="admin-modal-overlay">
        <div class="admin-modal-card">

            <div class="admin-modal-header">
                <h2>طلبات اشتراك السائقين</h2>
                <button type="button" class="close-modal-btn" onclick="closeDriverRequestsModal()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div class="admin-modal-search">
                <input
                    type="text"
                    id="driverSearchInput"
                    placeholder="ابحث عن سائق بالاسم أو ID"
                    onkeyup="filterDriverRequests()"
                />
            </div>

            <div class="admin-modal-table-wrapper">
                <table class="modern-dark-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>الاسم</th>
                            <th>العمر</th>
                            <th>الهاتف</th>
                            <th>التواصل</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="driverRequestsTableBody"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/service-worker.js");
      }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>براق | إحصائيات السائق</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#003366">
</head>
<body class="driver-dashboard-bg">

    <header class="main-header">
        <div class="navbar-container">
           
            <div class="header-right-side">
                <button class="burger-menu" onclick="openNav()">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </button>

                <div class="brand">
                    <img src="/img/my-horse4.png" alt="شعار براق" style="width: 30px; height: 30px; border-radius: 50%;">
                    <span>براق كابتن</span>
                </div>
                <a href="javascript:history.back()" class="back-link" style="color: white; text-decoration: none;">رجوع</a>
            </div>
        </div>
    </header>

    <main class="driver-stats-container">
        <h1 class="driver-stats-title">
            <i class="bi bi-speedometer2"></i>
            الإحصائيات
        </h1>

        <section class="stats-cards-grid">
            <div class="stats-card">
                <div class="stats-circle"><span id="todayTripsCount">0</span></div>
                <h3>رحلات اليوم</h3>
                <i class="bi bi-calendar-day stats-icon"></i>
            </div>

            <div class="stats-card">
                <div class="stats-circle"><span id="monthlyTripsCount">0</span></div>
                <h3>رحلات الشهر</h3>
                <i class="bi bi-calendar-month stats-icon"></i>
            </div>

            <div class="stats-card">
                <div class="stats-circle"><span id="todayEarnings">0 JD</span></div>
                <h3>أرباح اليوم</h3>
                <i class="bi bi-cash-coin stats-icon"></i>
            </div>

            <div class="stats-card">
                <div class="stats-circle"><span id="monthlyEarnings">0 JD</span></div>
                <h3>أرباح الشهر</h3>
                <i class="bi bi-wallet2 stats-icon"></i>
            </div>
        </section>

        <section class="trips-summary-box">
            <h2>ملخص الرحلات</h2>

            <div class="stats-bar-chart">
                <div class="stats-bar-item">
                    <span id="completedTripsCount">0</span>
                    <div class="stats-bar completed" style="height: 90px;"></div>
                    <p>منجزة</p>
                </div>

                <div class="stats-bar-item">
                    <span id="pendingTripsCount">0</span>
                    <div class="stats-bar pending" style="height: 65px;"></div>
                    <p>غير منجزة</p>
                </div>

                <div class="stats-bar-item">
                    <span id="postponedTripsCount">0</span>
                    <div class="stats-bar postponed" style="height: 45px;"></div>
                    <p>مؤجلة</p>
                </div>

                <div class="stats-bar-item">
                    <span id="cancelledTripsCount">0</span>
                    <div class="stats-bar cancelled" style="height: 35px;"></div>
                    <p>ملغية</p>
                </div>
            </div>
        </section>

        <section class="earnings-card">
            <div>
                <h2>المستحقات</h2>
                <p id="availableBalance">0.00 JD</p>
            </div>
           <button class="" id="withdrawBtn" onclick="openWithdrawModal()" >
  طلب سحب
</button>
        </section>
    </main>

    <div id="sideMenu" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>

        <div class="user-profile-sidebar" onclick="drivergoToProfile()" style="cursor: pointer;">
            <div class="sidebar-avatar-text" id="sidebarAvatar">ك</div>
            <h4 class="user-name" id="sidebarDriverName">...</h4>
            <p class="user-phone" id="sidebarDriverPhone">...</p>
        </div>

        <div class="sidebar-content">
            <a href="/index.html" class="driver-link">تبديل لوضع الركاب</a>
        </div>
    </div>
<div id="withdrawModal" class="visa-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center;">
  <div class="visa-modal-card" style="background: #ffffff; width: 90%; max-width: 400px; padding: 25px; border-radius: 15px; direction: rtl; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
    <h3 style="color: #003366; margin-bottom: 20px; text-align: center;"><i class="bi bi-wallet2"></i> تحويل الأرباح | سحب المبيعات</h3>
    
    <form id="withdrawForm" onsubmit="handleWithdrawSubmit(event)">
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; color: #333; font-weight: bold; text-align: right;">اسم صاحب الحساب:</label>
        <input type="text" id="bankUsername" required placeholder="الاسم الكامل" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
      </div>
      
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; color: #333; font-weight: bold; text-align: right;">طريقة السحب المفضلة:</label>
        <select id="withdrawMethod" onchange="toggleWithdrawFields()" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; background: white;">
          <option value="wallet">محفظة إلكترونية (زين كاش / أورنج)</option>
          <option value="bank">حساب بنكي (IBAN / كليك)</option>
        </select>
      </div>
      
      <div style="margin-bottom: 20px;">
        <label id="methodLabel" style="display: block; margin-bottom: 5px; color: #333; font-weight: bold; text-align: right;">رقم المحفظة الإلكترونية:</label>
        <input type="text" id="methodInput" required placeholder="079XXXXXXXX" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;">
      </div>
      
      <div style="display: flex; gap: 10px;">
        <button type="submit" style="flex: 2; background: #70AD47; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">
          تأكيد وإرسال طلب السحب
        </button>
        <button type="button" onclick="closeWithdrawModal()" style="flex: 1; background: #666; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer;">
          إلغاء
        </button>
      </div>
    </form>
  </div>
</div>
    <script src="/script.js"></script>
    <script src="/js/pages/driver-statistics.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/service-worker.js");
      }
    </script>
</body>
</html>
